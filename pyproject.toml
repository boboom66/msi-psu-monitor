[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-psu-monitor"
version = "1.0.0"
description = "Userspace monitoring tool for MSI MPG Ai1600TS PSU with GPU Safeguard+ per-pin current monitoring"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "MSI PSU Monitor Contributors", email = "contributors@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
keywords = ["msi", "psu", "monitoring", "hidraw", "gpu-safeguard", "power-supply"]

[project.urls]
Homepage = "https://github.com/msi-psu-monitor/msi-psu-monitor"
Repository = "https://github.com/msi-psu-monitor/msi-psu-monitor"
BugTracker = "https://github.com/msi-psu-monitor/msi-psu-monitor/issues"

[project.scripts]
msi-psu-monitor = "msi_psu_monitor.monitor:main"
msi-psu-monitor-daemon = "msi_psu_monitor.daemon:main"

[tool.setuptools.packages.find]
include = ["msi_psu_monitor*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Baseline for legacy code: only pyflakes + pycodestyle errors fail CI.
# Expand to ["E", "F", "BLE", "RUF"] during the planned refactor.
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
# Legacy files mix quote styles; a repo-wide format pass would churn the diff.
# Formatting stays opt-in per file until the refactor lands.
quote-style = "single"

[tool.mypy]
python_version = "3.10"
# Relaxed baseline: legacy modules are untyped. Flip to strict=true after the
# planned refactor adds annotations.
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
