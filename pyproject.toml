[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-psu-monitor"
version = "1.0.0"
description = "Userspace monitoring tool for MSI MPG Ai1600TS PSU with GPU Safeguard+ per-pin current monitoring"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "MSI PSU Monitor Contributors", email = "contributors@msi-psu-monitor"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
keywords = ["msi", "psu", "monitoring", "hidraw", "gpu-safeguard", "power-supply"]

[project.urls]
Homepage = "https://github.com/msi-psu-monitor/msi-psu-monitor"
Repository = "https://github.com/msi-psu-monitor/msi-psu-monitor"
BugTracker = "https://github.com/msi-psu-monitor/msi-psu-monitor/issues"

[project.scripts]
msi-psu-monitor = "msi_psu_monitor.monitor:main"

[tool.setuptools.packages.find]
include = ["msi_psu_monitor*"]
