[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-psu-monitor"
version = "1.0.1"
description = "Userspace monitoring tool for MSI MPG Ai1600TS PSU with GPU Safeguard+ per-pin current monitoring"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "MSI PSU Monitor Contributors", email = "contributors@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
keywords = ["msi", "psu", "monitoring", "hidraw", "gpu-safeguard", "power-supply"]

[project.urls]
# This tree is a fork of https://github.com/HesiPullupTimbo/msi-psu-monitor (MIT); that repository is the
# only public URL, so it is the honest place to point at until this fork has one.
Homepage = "https://github.com/HesiPullupTimbo/msi-psu-monitor"
Repository = "https://github.com/HesiPullupTimbo/msi-psu-monitor"

[project.scripts]
msi-psu-monitor = "msi_psu_monitor.monitor:main"
msi-psu-monitor-daemon = "msi_psu_monitor.daemon:main"

[tool.setuptools.packages.find]
include = ["msi_psu_monitor*"]

[dependency-groups]
# tomli is the stdlib tomllib backport for the 3.10 CI leg: two test modules parse
# pyproject.toml, and tomllib only exists from 3.11. Runtime dependencies stay [].
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "tomli>=2; python_version < '3.11'",
    "coverage>=7.16.2",
]
# Build-only: freezes the self-contained release binaries. Never a runtime
# dependency -- the shipped binary bundles CPython, the package itself stays
# stdlib-only (tests/test_stdlib_only.py enforces that).
build = ["pyinstaller==6.16.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Apply the format excludes even to paths named explicitly on the command line,
# so `ruff format msi_psu_monitor/protocol.py` cannot silently churn 350 lines.
force-exclude = true

[tool.ruff.lint]
# Baseline for legacy code: only pyflakes + pycodestyle errors fail CI.
# Expand to ["E", "F", "BLE", "RUF"] during the planned refactor.
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
# These files predate the formatter and mix quote styles. Formatting them is a
# few hundred lines of churn that hides the real change in review, so the
# formatter is barred from them by name -- the guardrail is machine-checked
# instead of remembered. `ruff check` still lints them normally.
exclude = [
    "msi_psu_monitor/protocol.py",
    "msi_psu_monitor/__init__.py",
    "msi_psu_monitor/__main__.py",
    "tests/test_monitor.py",
]

[tool.mypy]
python_version = "3.10"
# Relaxed baseline: legacy modules are untyped. Flip to strict=true after the
# planned refactor adds annotations.
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["msi_psu_monitor"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
