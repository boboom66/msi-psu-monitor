name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is what Debian trixie / current Ubuntu ship; 3.10 is the floor.
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No `|| fallback`: a broken dev sync must fail the job instead of
      # silently degrading to a different toolchain (the dev group is declared
      # in pyproject.toml and the runtime itself has zero dependencies).
      - name: Install deps
        run: uv sync --group dev
      - name: Ruff (lint)
        run: uv run --group dev ruff check .
      # Safe repo-wide now that [tool.ruff.format] excludes the legacy files and
      # force-exclude makes the exclusion stick for explicitly named paths.
      - name: Ruff (format)
        run: uv run --group dev ruff format --check .
      - name: Mypy
        run: uv run --group dev mypy msi_psu_monitor/
      # The install/packaging/smoke scripts are shipped to users and CI never
      # runs them for real, so lint them here. -S warning: the `[ x ] && ok ||
      # bad` reporter idiom in smoke.sh is intentional, not if-then-else.
      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh scripts/hardware/*.sh
      - name: Pytest
        run: uv run --group dev pytest -q
      - name: Coverage (branch)
        run: |
          uv run --group dev coverage run --branch -m pytest -q
          uv run --group dev coverage report --fail-under=90
      # End-to-end on the synthetic PSU: CLI formats, alert exit 2, black box,
      # OCP, fan write, daemon -> prometheus + history, dashboard HTTP.
      - name: Smoke test (no hardware)
        run: bash scripts/smoke.sh
      # 5k accelerated samples: proves the resident loop keeps its state files
      # fresh and stays within the RSS/fd ceilings. Demo mode only.
      - name: Soak (5k accelerated samples)
        run: bash scripts/soak.sh 5000
      - name: Build the .deb
        run: bash scripts/build_deb.sh

  freeze:
    # The official download is a self-contained binary. Build it on the oldest
    # glibc we support (Ubuntu 22.04 = 2.35) and prove it needs no Python.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the build toolchain
        run: uv sync --group dev --group build
      - name: Build the self-contained binaries
        run: bash scripts/build_binary.sh
      - name: Build the zero-Python .deb
        run: bash scripts/build_deb_binary.sh
      - name: Prove the release needs no Python
        run: |
          ! dpkg-deb -f dist/msi-psu-monitor_*_amd64.deb Depends | grep -q python
          env -i PATH=/usr/bin:/bin HOME=/tmp MSI_PSU_DEMO=1 \
            ./dist/bin/linux-x86_64/msi-psu-monitor --once >/dev/null
      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
