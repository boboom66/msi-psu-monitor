name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches pyproject.toml
        run: |
          VERSION=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "v$VERSION" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} does not match v$VERSION"; exit 1; }
      - name: Install dependencies
        run: uv sync --group dev --group build
      - name: Static gates
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .
          uv run --group dev mypy msi_psu_monitor/
      - name: Test
        run: uv run --group dev pytest -q
      - name: Smoke test (no hardware)
        run: bash scripts/smoke.sh
      - name: Build the self-contained binaries
        run: bash scripts/build_binary.sh
      - name: Build the zero-Python .deb
        run: bash scripts/build_deb_binary.sh
      - name: Assert the package does not require Python
        run: |
          ! dpkg-deb -f dist/msi-psu-monitor_*_${{ matrix.deb_arch }}.deb Depends | grep -q python
      - name: Generate the SBOM
        run: |
          python3 scripts/build_sbom.py --dist dist \
            --output dist/SBOM-${{ matrix.arch }}.json --arch ${{ matrix.arch }}
      - name: Build the hardware acceptance kit
        run: bash scripts/build_hardware_kit.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/msi-psu-monitor_*.tar.gz
            dist/msi-psu-monitor_*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/SBOM-*.json
            dist/*hardware-kit*.tar.gz
            dist/*hardware-kit*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate the combined checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.deb SBOM-*.json > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/msi-psu-monitor_*.tar.gz dist/*.deb dist/SBOM-*.json \
            dist/*hardware-kit*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
